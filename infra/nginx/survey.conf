# Survey reverse proxy: bot-challenge gate + rate limits in front of LimeSurvey.
# In production Cloudflare (WAF, Turnstile, DDoS) sits in front of this.

# Behind Caddy (staging/production) the visitor address arrives in X-Real-IP
# (Caddy resolves it through Cloudflare's trusted ranges); accept that header
# only from the Docker networks.
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Real-IP;

# Resolve upstream names per request through Docker's DNS. With a literal host in
# proxy_pass, nginx resolves it once at start, so after the gate or LimeSurvey is
# recreated (new IP) it keeps proxying to the old address (502/500).
resolver 127.0.0.11 valid=10s ipv6=off;
map "" $gate_host       { default gate; }
map "" $limesurvey_host { default limesurvey; }

# Keep the original scheme from the HTTPS proxy in front (Caddy); fall back to ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Only POSTs (answer submissions) count towards the submission limit.
map $request_method $survey_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $survey_post_key     zone=survey_post:10m rate=60r/m;
limit_req_zone $binary_remote_addr  zone=gate:10m        rate=30r/m;

# HTTP: used as-is in staging/production, where TLS terminates at the
# DigitalOcean load balancer / Cloudflare in front of this proxy.
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;      # keep the public host:port; nginx only knows its internal port
    client_max_body_size 64k;   # survey pages post a few KB at most
    include /etc/nginx/snippets/survey-locations.inc;
}

# HTTPS: local testing of the bot check, which browsers only run in a secure
# context (HTTPS or localhost). Certificates from scripts/make-local-certs.sh.
server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 64k;
    include /etc/nginx/snippets/survey-locations.inc;
}

# LimeSurvey admin: reached only through its own hostname (Caddy -> :8090),
# and only with a Cloudflare Access token the gate has verified. Locally, with
# no Access settings, the gate allows it (published on LS_ADMIN_PORT).
server {
    listen 8090;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 32m;   # survey imports and theme uploads

    location = /_access_check {
        internal;
        proxy_pass http://$gate_host:8000/access/check;   # receives Cf-Access-Jwt-Assertion
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = / {
        return 302 /index.php/admin;
    }

    location / {
        auth_request /_access_check;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass http://$limesurvey_host:8080;
    }
}
