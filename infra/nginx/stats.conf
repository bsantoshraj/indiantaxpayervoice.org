# Public statistics: static, precomputed, read-only. Mirrors what a CDN in
# front of object storage would serve in production.
limit_req_zone $binary_remote_addr zone=stats:10m rate=20r/s;

server {
    listen 8080;
    server_tokens off;
    root /srv/stats/current;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    limit_req zone=stats burst=40 nodelay;
    limit_req_status 429;

    # /v1/statistics/summary -> summary.json (and .json / .csv directly)
    location ~ ^/v1/statistics/(summary|states|industries|breakdowns|distributions|trends)(\.json)?$ {
        default_type application/json;
        try_files /v1/statistics/$1.json =404;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /v1/statistics/states.csv {
        default_type text/csv;
        add_header Content-Disposition 'attachment; filename="itv-states.csv"' always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ready once a release has been published; reveals nothing else.
    location = /health/ready {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        if (!-f $document_root/v1/statistics/summary.json) { return 503 "not ready\n"; }
        return 200 "ready\n";
    }

    location / { return 404; }
}
