; Loaded by the WordPress and LimeSurvey containers (compose.yaml).
; CVE-2026-115560 (PHP session-handler RCE, announced 2026-10-23, no fixed PHP
; release yet): PHP's recommended mitigation. Neither app uses upload progress.
session.upload_progress.enabled = 0
; Do not advertise the PHP version in response headers.
expose_php = Off
