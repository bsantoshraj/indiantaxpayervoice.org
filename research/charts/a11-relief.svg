<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" role="img" aria-labelledby="t d" style="max-width:720px;height:auto;font-family:inherit,system-ui,sans-serif"><title id="t">Budget 2025 tax cut as a share of tax paid, by taxable income</title><desc id="d">₹12 lakh: 100% (₹80,000); ₹16 lakh: 29% (₹50,000); ₹20 lakh: 31% (₹90,000); ₹25 lakh: 25% (₹1,10,000); ₹50 lakh: 9% (₹1,10,000).</desc><rect width="720" height="400" fill="#FFFFFF"/><text x="20.0" y="30.0" font-size="17" fill="#12232E" text-anchor="start" font-weight="bold">Who gained most from Budget 2025</text><text x="20.0" y="52.0" font-size="13" fill="#56656F" text-anchor="start" font-weight="normal">Cut in income tax as a share of the tax paid before, by taxable income (new regime)</text><line x1="60" x2="700" y1="300.0" y2="300.0" stroke="#DCE3E7"/><text x="52.0" y="304.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">0%</text><line x1="60" x2="700" y1="245.0" y2="245.0" stroke="#DCE3E7"/><text x="52.0" y="249.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">25%</text><line x1="60" x2="700" y1="190.0" y2="190.0" stroke="#DCE3E7"/><text x="52.0" y="194.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">50%</text><line x1="60" x2="700" y1="135.0" y2="135.0" stroke="#DCE3E7"/><text x="52.0" y="139.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">75%</text><line x1="60" x2="700" y1="80.0" y2="80.0" stroke="#DCE3E7"/><text x="52.0" y="84.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">100%</text><path d="M92.0,300 V84.0 Q92.0,80.0 96.0,80.0 H152.0 Q156.0,80.0 156.0,84.0 V300 Z" fill="#0E7570"><title>₹12 lakh: tax ₹80,000 before, ₹0 after; saves ₹80,000 (100%)</title></path><text x="124.0" y="72.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">100%</text><text x="124.0" y="320.0" font-size="13" fill="#12232E" text-anchor="middle" font-weight="bold">₹12 lakh</text><text x="124.0" y="338.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">saves ₹80,000</text><path d="M220.0,300 V239.3 Q220.0,235.3 224.0,235.3 H280.0 Q284.0,235.3 284.0,239.3 V300 Z" fill="#0E7570"><title>₹16 lakh: tax ₹1,70,000 before, ₹1,20,000 after; saves ₹50,000 (29%)</title></path><text x="252.0" y="227.3" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">29%</text><text x="252.0" y="320.0" font-size="13" fill="#12232E" text-anchor="middle" font-weight="bold">₹16 lakh</text><text x="252.0" y="338.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">saves ₹50,000</text><path d="M348.0,300 V235.7 Q348.0,231.7 352.0,231.7 H408.0 Q412.0,231.7 412.0,235.7 V300 Z" fill="#0E7570"><title>₹20 lakh: tax ₹2,90,000 before, ₹2,00,000 after; saves ₹90,000 (31%)</title></path><text x="380.0" y="223.7" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">31%</text><text x="380.0" y="320.0" font-size="13" fill="#12232E" text-anchor="middle" font-weight="bold">₹20 lakh</text><text x="380.0" y="338.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">saves ₹90,000</text><path d="M476.0,300 V249.0 Q476.0,245.0 480.0,245.0 H536.0 Q540.0,245.0 540.0,249.0 V300 Z" fill="#0E7570"><title>₹25 lakh: tax ₹4,40,000 before, ₹3,30,000 after; saves ₹1,10,000 (25%)</title></path><text x="508.0" y="237.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">25%</text><text x="508.0" y="320.0" font-size="13" fill="#12232E" text-anchor="middle" font-weight="bold">₹25 lakh</text><text x="508.0" y="338.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">saves ₹1,10,000</text><path d="M604.0,300 V283.7 Q604.0,279.7 608.0,279.7 H664.0 Q668.0,279.7 668.0,283.7 V300 Z" fill="#0E7570"><title>₹50 lakh: tax ₹11,90,000 before, ₹10,80,000 after; saves ₹1,10,000 (9%)</title></path><text x="636.0" y="271.7" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">9%</text><text x="636.0" y="320.0" font-size="13" fill="#12232E" text-anchor="middle" font-weight="bold">₹50 lakh</text><text x="636.0" y="338.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">saves ₹1,10,000</text><text x="20.0" y="368.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="bold">The rupee saving grows to ₹1.1 lakh, but as a share of the tax paid it shrinks from 100% to 9%.</text><text x="20.0" y="388.0" font-size="12" fill="#56656F" text-anchor="start" font-weight="normal">Our calculation from the FY 2024-25 and FY 2025-26 new-regime slabs and rebates; excludes 4% cess.</text></svg>
