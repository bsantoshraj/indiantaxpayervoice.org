<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 295" width="100%" role="img" aria-labelledby="t d" style="max-width:720px;height:auto;font-family:inherit,system-ui,sans-serif"><title id="t">Share of residential sales by price band, H1 2025 and H1 2026</title><desc id="d">H1 2025: Under ₹50 lakh 22%, ₹50 lakh–1 crore 29%, ₹1–2 crore 27%, Above ₹2 crore 22%; H1 2026: Under ₹50 lakh 19%, ₹50 lakh–1 crore 27%, ₹1–2 crore 29%, Above ₹2 crore 25%.</desc><rect width="720" height="295" fill="#FFFFFF"/><text x="20.0" y="30.0" font-size="17" fill="#12232E" text-anchor="start" font-weight="bold">More homes now sell above ₹1 crore</text><text x="20.0" y="52.0" font-size="13" fill="#56656F" text-anchor="start" font-weight="normal">Share of residential sales by price, eight cities (Knight Frank)</text><rect x="20" y="70" width="14" height="14" rx="3" fill="#7DBFB9"/><text x="40.0" y="82.0" font-size="12.5" fill="#12232E" text-anchor="start" font-weight="normal">Under ₹50 lakh</text><rect x="166.8" y="70" width="14" height="14" rx="3" fill="#3A9893"/><text x="186.8" y="82.0" font-size="12.5" fill="#12232E" text-anchor="start" font-weight="normal">₹50 lakh–1 crore</text><rect x="328.0" y="70" width="14" height="14" rx="3" fill="#0E7570"/><text x="348.0" y="82.0" font-size="12.5" fill="#12232E" text-anchor="start" font-weight="normal">₹1–2 crore</text><rect x="446.0" y="70" width="14" height="14" rx="3" fill="#073F40"/><text x="466.0" y="82.0" font-size="12.5" fill="#12232E" text-anchor="start" font-weight="normal">Above ₹2 crore</text><text x="108.0" y="130.0" font-size="13" fill="#12232E" text-anchor="end" font-weight="bold">H1 2025</text><rect x="120.0" y="104" width="123.4" height="40" fill="#7DBFB9"><title>H1 2025, Under ₹50 lakh: 22% of sales</title></rect><text x="182.7" y="130.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">22%</text><rect x="245.4" y="104" width="163.3" height="40" fill="#3A9893"><title>H1 2025, ₹50 lakh–1 crore: 29% of sales</title></rect><text x="328.1" y="130.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">29%</text><rect x="410.7" y="104" width="151.9" height="40" fill="#0E7570"><title>H1 2025, ₹1–2 crore: 27% of sales</title></rect><text x="487.7" y="130.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">27%</text><rect x="564.6" y="104" width="123.4" height="40" fill="#073F40"><title>H1 2025, Above ₹2 crore: 22% of sales</title></rect><text x="627.3" y="130.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">22%</text><text x="108.0" y="196.0" font-size="13" fill="#12232E" text-anchor="end" font-weight="bold">H1 2026</text><rect x="120.0" y="170" width="106.3" height="40" fill="#7DBFB9"><title>H1 2026, Under ₹50 lakh: 19% of sales</title></rect><text x="174.2" y="196.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">19%</text><rect x="228.3" y="170" width="151.9" height="40" fill="#3A9893"><title>H1 2026, ₹50 lakh–1 crore: 27% of sales</title></rect><text x="305.2" y="196.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">27%</text><rect x="382.2" y="170" width="163.3" height="40" fill="#0E7570"><title>H1 2026, ₹1–2 crore: 29% of sales</title></rect><text x="464.9" y="196.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">29%</text><rect x="547.5" y="170" width="140.5" height="40" fill="#073F40"><title>H1 2026, Above ₹2 crore: 25% of sales</title></rect><text x="618.8" y="196.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">25%</text><text x="20.0" y="262.0" font-size="13.5" fill="#12232E" text-anchor="start" font-weight="bold">Above ₹1 crore: 49% → 54% of sales in a year. Under ₹50 lakh: 22% → 19%.</text><text x="20.0" y="282.0" font-size="12" fill="#56656F" text-anchor="start" font-weight="normal">Source: Knight Frank, India Real Estate H1 2026 (new homes sold, eight cities).</text></svg>
