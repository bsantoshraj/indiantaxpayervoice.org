<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" role="img" aria-labelledby="t d" style="max-width:720px;height:auto;font-family:inherit,system-ui,sans-serif"><title id="t">Tax relief on a rented-out flat&#x27;s loss, before and after the 2017 cap</title><desc id="d">Before AY 2018-19: ₹1,84,080 a year; From AY 2018-19, old regime: ₹62,400 a year; New regime: ₹0 a year.</desc><rect width="720" height="350" fill="#FFFFFF"/><text x="20.0" y="30.0" font-size="17" fill="#12232E" text-anchor="start" font-weight="bold">Tax relief on a rented-out flat&#x27;s loss</text><text x="20.0" y="52.0" font-size="13" fill="#56656F" text-anchor="start" font-weight="normal">Our example: ₹94 lakh loan at 8.5%, ₹3 lakh rent, loss of ₹5,90,000 a year; 30% slab plus cess</text><line x1="240.0" x2="240.0" y1="88" y2="266" stroke="#DCE3E7"/><text x="240.0" y="284.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">₹0</text><line x1="322.5" x2="322.5" y1="88" y2="266" stroke="#DCE3E7"/><text x="322.5" y="284.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">₹50,000</text><line x1="405.0" x2="405.0" y1="88" y2="266" stroke="#DCE3E7"/><text x="405.0" y="284.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">₹1,00,000</text><line x1="487.5" x2="487.5" y1="88" y2="266" stroke="#DCE3E7"/><text x="487.5" y="284.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">₹1,50,000</text><line x1="570.0" x2="570.0" y1="88" y2="266" stroke="#DCE3E7"/><text x="570.0" y="284.0" font-size="12" fill="#56656F" text-anchor="middle" font-weight="normal">₹2,00,000</text><text x="228.0" y="126.3" font-size="13" fill="#12232E" text-anchor="end" font-weight="bold">Before AY 2018-19</text><path d="M240,104.0 H539.7 Q543.7,104.0 543.7,108.0 V134.7 Q543.7,138.7 539.7,138.7 H240 Z" fill="#0E7570"><title>Before AY 2018-19: ₹5,90,000 of the loss counts; tax saved ₹1,84,080 a year</title></path><text x="551.7" y="126.3" font-size="13" fill="#12232E" text-anchor="start" font-weight="bold">₹1,84,080 a year</text><text x="228.0" y="183.0" font-size="13" fill="#12232E" text-anchor="end" font-weight="bold">From AY 2018-19, old regime</text><path d="M240,160.7 H339.0 Q343.0,160.7 343.0,164.7 V191.3 Q343.0,195.3 339.0,195.3 H240 Z" fill="#0E7570"><title>From AY 2018-19, old regime: ₹2,00,000 of the loss counts; tax saved ₹62,400 a year</title></path><text x="351.0" y="183.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="bold">₹62,400 a year</text><text x="228.0" y="239.7" font-size="13" fill="#12232E" text-anchor="end" font-weight="bold">New regime</text><text x="248.0" y="239.7" font-size="13" fill="#12232E" text-anchor="start" font-weight="bold">₹0 a year</text><text x="20.0" y="318.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="bold">Same flat, same loan: two-thirds of the relief went in 2018-19; the new regime gives none.</text><text x="20.0" y="338.0" font-size="12" fill="#56656F" text-anchor="start" font-weight="normal">Our calculation. Law: Finance Act 2017, s.71(3A); Income Tax Department rules for AY 2026-27.</text></svg>
