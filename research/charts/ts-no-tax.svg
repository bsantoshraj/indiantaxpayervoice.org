<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="100%" role="img" aria-labelledby="t d" style="max-width:720px;height:auto;font-family:inherit,system-ui,sans-serif"><title id="t">Most people who file pay no income tax</title><desc id="d">No tax payable: AY 2012-13 56.4%, AY 2013-14 50.4%, AY 2014-15 47.7%, AY 2015-16 49.5%, AY 2016-17 44.4%, AY 2017-18 43.4%, AY 2018-19 40.5%, AY 2019-20 43.5%, AY 2020-21 68.7%, AY 2021-22 67.3%, AY 2022-23 61.5%, AY 2023-24 62.7%</desc><rect width="720" height="410" fill="#FFFFFF"/><text x="20.0" y="30.0" font-size="17" fill="#12232E" text-anchor="start" font-weight="bold">Most people who file pay no income tax</text><text x="20.0" y="52.0" font-size="13" fill="#56656F" text-anchor="start" font-weight="normal">Share of individual returns with no tax payable</text><line x1="64" x2="600" y1="316.0" y2="316.0" stroke="#DCE3E7"/><text x="56.0" y="320.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">0%</text><line x1="64" x2="600" y1="261.0" y2="261.0" stroke="#DCE3E7"/><text x="56.0" y="265.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">20%</text><line x1="64" x2="600" y1="206.0" y2="206.0" stroke="#DCE3E7"/><text x="56.0" y="210.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">40%</text><line x1="64" x2="600" y1="151.0" y2="151.0" stroke="#DCE3E7"/><text x="56.0" y="155.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">60%</text><line x1="64" x2="600" y1="96.0" y2="96.0" stroke="#DCE3E7"/><text x="56.0" y="100.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">80%</text><text x="112.7" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2013-14</text><text x="210.2" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2015-16</text><text x="307.6" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2017-18</text><text x="405.1" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2019-20</text><text x="502.5" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2021-22</text><text x="600.0" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2023-24</text><text x="332.0" y="356.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">Assessment year (income earned the year before)</text><line x1="453.8" x2="453.8" y1="90" y2="316" stroke="#56656F" stroke-dasharray="4 4"/><text x="447.8" y="102.0" font-size="11.5" fill="#12232E" text-anchor="end" font-weight="bold">jump in AY 2020-21</text><path d="M64.0,160.9 L112.7,177.3 L161.5,184.8 L210.2,179.9 L258.9,193.8 L307.6,196.7 L356.4,204.7 L405.1,196.5 L453.8,127.0 L502.5,131.0 L551.3,146.9 L600.0,143.6" fill="none" stroke="#00897B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="64.0" cy="160.9" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2012-13: 56.4%</title></circle><circle cx="112.7" cy="177.3" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2013-14: 50.4%</title></circle><circle cx="161.5" cy="184.8" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2014-15: 47.7%</title></circle><circle cx="210.2" cy="179.9" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2015-16: 49.5%</title></circle><circle cx="258.9" cy="193.8" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2016-17: 44.4%</title></circle><circle cx="307.6" cy="196.7" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2017-18: 43.4%</title></circle><circle cx="356.4" cy="204.7" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2018-19: 40.5%</title></circle><circle cx="405.1" cy="196.5" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2019-20: 43.5%</title></circle><circle cx="453.8" cy="127.0" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2020-21: 68.7%</title></circle><circle cx="502.5" cy="131.0" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2021-22: 67.3%</title></circle><circle cx="551.3" cy="146.9" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2022-23: 61.5%</title></circle><circle cx="600.0" cy="143.6" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>No tax payable, AY 2023-24: 62.7%</title></circle><text x="70.0" y="150.9" font-size="12" fill="#12232E" text-anchor="start" font-weight="bold">56.4%</text><text x="610.0" y="147.6" font-size="12.5" fill="#12232E" text-anchor="start" font-weight="bold">62.7%</text><text x="20.0" y="378.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="bold">The share fell to 40%, then jumped to 69% in AY 2020-21 and has stayed above 60%.</text><text x="20.0" y="398.0" font-size="12" fill="#56656F" text-anchor="start" font-weight="normal">Source: CBDT Income Tax Return Statistics (individuals). Table 2.11.</text></svg>
