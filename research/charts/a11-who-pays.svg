<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t d" style="max-width:720px;height:auto;font-family:inherit,system-ui,sans-serif"><title id="t">Who pays individual income tax, AY 2023-24</title><desc id="d">1.4% of individual returns, those with tax payable of ₹10 lakh or more, paid 50.3% of all individual income tax. 62.7% of returns had no tax payable.</desc><rect width="720" height="300" fill="#FFFFFF"/><text x="20.0" y="30.0" font-size="17" fill="#12232E" text-anchor="start" font-weight="bold">Who pays individual income tax</text><text x="20.0" y="52.0" font-size="13" fill="#56656F" text-anchor="start" font-weight="normal">Tax-payable groups, share of all individual returns and of all tax payable, AY 2023-24</text><rect x="20" y="70" width="14" height="14" rx="3" fill="#7DBFB9"/><polygon points="692.3,150 700.0,150 700.0,200 423.2,200" fill="#073F40" fill-opacity="0.14"/><text x="40.0" y="82.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="normal">No tax</text><rect x="111.8" y="70" width="14" height="14" rx="3" fill="#3A9893"/><text x="131.8" y="82.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="normal">Tax up to ₹1.5 lakh</text><rect x="298.5" y="70" width="14" height="14" rx="3" fill="#0E7570"/><text x="318.5" y="82.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="normal">₹1.5–10 lakh</text><rect x="434.1" y="70" width="14" height="14" rx="3" fill="#073F40"/><text x="454.1" y="82.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="normal">₹10 lakh or more</text><text x="138.0" y="137.0" font-size="13" fill="#12232E" text-anchor="end" font-weight="bold">Share of returns</text><rect x="150.0" y="110" width="342.7" height="40" rx="4" fill="#7DBFB9"><title>No tax: 62.7% (4,72,99,925 returns)</title></rect><text x="322.4" y="136.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">62.7%</text><rect x="494.7" y="110" width="147.3" height="40" rx="0" fill="#3A9893"><title>Tax up to ₹1.5 lakh: 27.2% (2,04,90,677 returns)</title></rect><text x="569.4" y="136.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">27.2%</text><rect x="644.1" y="110" width="46.2" height="40" rx="0" fill="#0E7570"><title>₹1.5–10 lakh: 8.8% (66,11,366 returns)</title></rect><text x="668.2" y="136.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8.8%</text><rect x="692.3" y="110" width="7.7" height="40" rx="4" fill="#073F40"><title>₹10 lakh or more: 1.4% (10,59,318 returns)</title></rect><text x="138.0" y="227.0" font-size="13" fill="#12232E" text-anchor="end" font-weight="bold">Share of tax paid</text><rect x="150.0" y="200" width="71.4" height="40" rx="0" fill="#3A9893"><title>Tax up to ₹1.5 lakh: 13.3% (₹90,358 crore)</title></rect><text x="186.7" y="226.0" font-size="14" fill="#12232E" text-anchor="middle" font-weight="bold">13.3%</text><rect x="223.4" y="200" width="197.8" height="40" rx="0" fill="#0E7570"><title>₹1.5–10 lakh: 36.3% (₹2,46,059 crore)</title></rect><text x="323.3" y="226.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">36.3%</text><rect x="423.2" y="200" width="276.8" height="40" rx="4" fill="#073F40"><title>₹10 lakh or more: 50.3% (₹3,40,934 crore)</title></rect><text x="561.6" y="226.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">50.3%</text><text x="700.0" y="172.0" font-size="13" fill="#12232E" text-anchor="end" font-weight="bold">1.4% of returns</text><text x="20.0" y="268.0" font-size="14" fill="#12232E" text-anchor="start" font-weight="bold">1.4% of individual returns paid half of all individual income tax. 62.7% paid none.</text><text x="20.0" y="288.0" font-size="12" fill="#56656F" text-anchor="start" font-weight="normal">Source: CBDT, Income Tax Return Statistics AY 2023-24, table 2.11 (income of 2022-23).</text></svg>
