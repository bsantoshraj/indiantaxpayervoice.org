<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="100%" role="img" aria-labelledby="t d" style="max-width:720px;height:auto;font-family:inherit,system-ui,sans-serif"><title id="t">Half of all individual income tax now comes from 1.4% of returns</title><desc id="d">Share of tax from returns paying ₹10 lakh or more: AY 2012-13 40.9%, AY 2013-14 38.2%, AY 2014-15 38.5%, AY 2015-16 41.4%, AY 2016-17 40.3%, AY 2017-18 41.6%, AY 2018-19 44.4%, AY 2019-20 46.1%, AY 2020-21 47.5%, AY 2021-22 47.6%, AY 2022-23 51.5%, AY 2023-24 50.3%</desc><rect width="720" height="410" fill="#FFFFFF"/><text x="20.0" y="30.0" font-size="17" fill="#12232E" text-anchor="start" font-weight="bold">Half of all individual income tax now comes from 1.4% of returns</text><text x="20.0" y="52.0" font-size="13" fill="#56656F" text-anchor="start" font-weight="normal">Share of all individual tax payable that came from returns with tax of ₹10 lakh or more</text><line x1="64" x2="600" y1="316.0" y2="316.0" stroke="#DCE3E7"/><text x="56.0" y="320.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">0%</text><line x1="64" x2="600" y1="242.7" y2="242.7" stroke="#DCE3E7"/><text x="56.0" y="246.7" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">20%</text><line x1="64" x2="600" y1="169.3" y2="169.3" stroke="#DCE3E7"/><text x="56.0" y="173.3" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">40%</text><line x1="64" x2="600" y1="96.0" y2="96.0" stroke="#DCE3E7"/><text x="56.0" y="100.0" font-size="12" fill="#56656F" text-anchor="end" font-weight="normal">60%</text><text x="112.7" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2013-14</text><text x="210.2" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2015-16</text><text x="307.6" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2017-18</text><text x="405.1" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2019-20</text><text x="502.5" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2021-22</text><text x="600.0" y="336.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">2023-24</text><text x="332.0" y="356.0" font-size="11.5" fill="#56656F" text-anchor="middle" font-weight="normal">Assessment year (income earned the year before)</text><path d="M64.0,166.0 L112.7,175.9 L161.5,174.8 L210.2,164.2 L258.9,168.2 L307.6,163.5 L356.4,153.2 L405.1,147.0 L453.8,141.8 L502.5,141.5 L551.3,127.2 L600.0,131.6" fill="none" stroke="#00897B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="64.0" cy="166.0" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2012-13: 40.9%</title></circle><circle cx="112.7" cy="175.9" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2013-14: 38.2%</title></circle><circle cx="161.5" cy="174.8" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2014-15: 38.5%</title></circle><circle cx="210.2" cy="164.2" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2015-16: 41.4%</title></circle><circle cx="258.9" cy="168.2" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2016-17: 40.3%</title></circle><circle cx="307.6" cy="163.5" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2017-18: 41.6%</title></circle><circle cx="356.4" cy="153.2" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2018-19: 44.4%</title></circle><circle cx="405.1" cy="147.0" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2019-20: 46.1%</title></circle><circle cx="453.8" cy="141.8" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2020-21: 47.5%</title></circle><circle cx="502.5" cy="141.5" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2021-22: 47.6%</title></circle><circle cx="551.3" cy="127.2" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2022-23: 51.5%</title></circle><circle cx="600.0" cy="131.6" r="4" fill="#00897B" stroke="#FFFFFF" stroke-width="1.5"><title>Share of tax from returns paying ₹10 lakh or more, AY 2023-24: 50.3%</title></circle><text x="70.0" y="156.0" font-size="12" fill="#12232E" text-anchor="start" font-weight="bold">40.9%</text><text x="610.0" y="135.6" font-size="12.5" fill="#12232E" text-anchor="start" font-weight="bold">50.3%</text><text x="20.0" y="378.0" font-size="13" fill="#12232E" text-anchor="start" font-weight="bold">Those returns were 0.53% of all returns in AY 2012-13 and 1.4% in AY 2023-24.</text><text x="20.0" y="398.0" font-size="12" fill="#56656F" text-anchor="start" font-weight="normal">Source: CBDT Income Tax Return Statistics (individuals). Table 2.11. The ₹10 lakh line is not inflation-adjusted.</text></svg>
