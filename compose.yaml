# Local development stack for Indian Taxpayer Voice.
#
# Three isolated networks mirror the production trust boundaries:
#   wp_net   WordPress  <-> WordPress DB         (no survey data)
#   ls_net   LimeSurvey <-> LimeSurvey DB        (raw responses live here only)
#   agg_net  aggregator  -> LimeSurvey RemoteControl API (export only)
#   survey_net  survey-proxy -> gate (bot check) -> LimeSurvey (public survey entry)
# WordPress cannot reach either LimeSurvey or its database; it can only read
# the public statistics server (stats_net). Public statistics
# are static JSON served by the `stats` container (a CDN/object store in prod).
#
# Ports bind to BIND_ADDR (default 127.0.0.1). Run scripts/init-local-env.sh first.

name: itv

x-restart: &restart
  restart: unless-stopped

services:
  # Local only (profile "localdb"); staging runs MariaDB on the host instead.
  wp-db:
    <<: *restart
    profiles: [localdb]
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME}
      MARIADB_USER: ${WP_DB_USER}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - wp_db:/var/lib/mysql
    networks: [wp_net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    <<: *restart
    image: wordpress:7.1.3-php8.3-apache
    depends_on:
      wp-db: { condition: service_healthy, required: false }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      WORDPRESS_DB_HOST: ${WP_DB_HOST:-wp-db}
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      ITV_CF_BEACON_TOKEN: ${ITV_CF_BEACON_TOKEN:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        // Cloudflare Web Analytics beacon token (public; empty = no analytics).
        define('ITV_CF_BEACON_TOKEN', getenv('ITV_CF_BEACON_TOKEN') ?: '');
        // Behind the HTTPS proxy (staging/production); WordPress is not reachable directly.
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_AUTO_UPDATE_CORE', 'minor');
        # Server-side fetch of public aggregates only (a CDN URL in production).
        define('ITV_STATS_BASE_URL', 'http://stats:8080/v1/statistics');
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WP_PORT}:80"
    volumes:
      - wp_html:/var/www/html
      - ./infra/php/zz-itv-hardening.ini:/usr/local/etc/php/conf.d/zz-itv-hardening.ini:ro
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wordpress/themes/itv:/var/www/html/wp-content/themes/itv:ro
    networks: [wp_net, stats_net]

  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: [tools]
    user: "33:33"
    depends_on: [wordpress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      WORDPRESS_DB_HOST: ${WP_DB_HOST:-wp-db}
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WP_URL: ${WP_URL}
      LS_PUBLIC_URL: ${LS_PUBLIC_URL}
      ITV_LS_SURVEY_ID: ${ITV_LS_SURVEY_ID:-}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      ITV_ENV: ${ITV_ENV:-local}
    volumes:
      - wp_html:/var/www/html
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wordpress/themes/itv:/var/www/html/wp-content/themes/itv:ro
      - ./wordpress/bootstrap.sh:/bootstrap.sh:ro
      - ./wordpress/content:/content:ro
    networks: [wp_net]

  ls-db:
    <<: *restart
    profiles: [localdb]
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: ${LS_DB_NAME}
      MARIADB_USER: ${LS_DB_USER}
      MARIADB_PASSWORD: ${LS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${LS_DB_ROOT_PASSWORD}
    command: ["--max-connections=200", "--innodb-lock-wait-timeout=20"]
    volumes:
      - ls_db:/var/lib/mysql
    networks: [ls_net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  limesurvey:
    <<: *restart
    image: martialblog/limesurvey:7.5.1-261021-apache
    depends_on:
      ls-db: { condition: service_healthy, required: false }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DB_TYPE: mysql
      DB_HOST: ${LS_DB_HOST:-ls-db}
      DB_NAME: ${LS_DB_NAME}
      DB_USERNAME: ${LS_DB_USER}
      DB_PASSWORD: ${LS_DB_PASSWORD}
      DB_MYSQL_ENGINE: InnoDB
      ADMIN_USER: ${LS_ADMIN_USER}
      ADMIN_PASSWORD: ${LS_ADMIN_PASSWORD}
      ADMIN_NAME: Survey Administrator
      ADMIN_EMAIL: ${LS_ADMIN_EMAIL}
      PUBLIC_URL: ${LS_PUBLIC_URL}
      URL_FORMAT: path
      # Sessions in the database so replicas behind a load balancer agree.
      TABLE_SESSION: "true"
      ENCRYPT_KEYPAIR: ${LS_ENCRYPT_KEYPAIR}
      ENCRYPT_PUBLIC_KEY: ${LS_ENCRYPT_PUBLIC_KEY}
      ENCRYPT_SECRET_KEY: ${LS_ENCRYPT_SECRET_KEY}
      ENCRYPT_NONCE: ${LS_ENCRYPT_NONCE}
      ENCRYPT_SECRET_BOX_KEY: ${LS_ENCRYPT_SECRET_BOX_KEY}
    volumes:
      # Uploaded files and survey assets: shared storage in production.
      - ls_upload:/var/www/html/upload
      - ./infra/php/zz-itv-hardening.ini:/usr/local/etc/php/conf.d/zz-itv-hardening.ini:ro
    networks: [ls_net, agg_net, survey_net]

  # Bot-challenge gate (ALTCHA proof of work; Turnstile when keys are set).
  gate:
    <<: *restart
    build: ./gate
    image: ${ITV_IMAGE_REPO:-itv}-gate:${ITV_IMAGE_TAG:-local}   # CI: ghcr.io/bsantoshraj/itv-gate:<sha>
    environment:
      ITV_ENV: ${ITV_ENV:-production}
      ITV_GATE_ENABLED: ${ITV_GATE_ENABLED:-1}
      ITV_GATE_SECRET: ${ITV_GATE_SECRET}
      ITV_GATE_SECURE_COOKIE: ${ITV_GATE_SECURE_COOKIE:-1}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # Controlled release (infra/env/<env>.env): 0 = the survey is closed to the public.
      ITV_SURVEY_OPEN: ${ITV_SURVEY_OPEN:-1}
      ITV_SITE_URL: ${WP_URL:-}
      # Cloudflare Access check for the LimeSurvey admin (required in staging/production).
      ITV_ACCESS_TEAM_DOMAIN: ${ITV_ACCESS_TEAM_DOMAIN:-}
      ITV_ACCESS_AUD: ${ITV_ACCESS_AUD:-}
      ITV_ACCESS_ALLOWED_EMAILS: ${ITV_ACCESS_ALLOWED_EMAILS:-}
    networks: [survey_net]

  # Public entry point for the survey: gate check + rate limits.
  survey-proxy:
    <<: *restart
    image: nginx:1.30.6-alpine
    depends_on: [limesurvey, gate]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${LS_PORT}:8080"
      - "${BIND_ADDR:-127.0.0.1}:${LS_TLS_PORT:-8443}:8443"
      - "${BIND_ADDR:-127.0.0.1}:${LS_ADMIN_PORT:-8083}:8090"   # LimeSurvey admin (Access-checked)
    volumes:
      - ./infra/nginx/survey.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/survey-locations.inc:/etc/nginx/snippets/survey-locations.inc:ro
      - ./var/certs:/etc/nginx/certs:ro
    networks: [survey_net]

  aggregator:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    image: ${ITV_IMAGE_REPO:-itv}-aggregator:${ITV_IMAGE_TAG:-local}   # CI: ghcr.io/bsantoshraj/itv-aggregator:<sha>
    profiles: [jobs]
    depends_on: [limesurvey]
    environment:
      ITV_LS_URL: http://limesurvey:8080/index.php/admin/remotecontrol
      ITV_LS_ALLOW_HTTP: "1"
      ITV_LS_SURVEY_ID: ${ITV_LS_SURVEY_ID:-0}
      ITV_LS_USER: ${ITV_LS_USER}
      ITV_LS_PASSWORD: ${ITV_LS_PASSWORD}
      ITV_MIN_COHORT: ${ITV_MIN_COHORT:-20}
      ITV_ROUNDING: ${ITV_ROUNDING:-5}
    volumes:
      - stats:/srv/stats
    networks: [agg_net]

  # Scheduler: refresh public statistics every ITV_AGG_INTERVAL seconds, hourly by
  # default (differencing protection: each release mixes many responses). In production
  # this is a scheduled job (cron / App Platform job), not a long-lived loop.
  aggregator-cron:
    <<: *restart
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    image: ${ITV_IMAGE_REPO:-itv}-aggregator:${ITV_IMAGE_TAG:-local}   # CI: ghcr.io/bsantoshraj/itv-aggregator:<sha>
    depends_on: [limesurvey]
    entrypoint: ["sh", "-c", "while true; do python -m itv_aggregator; sleep \"$${ITV_AGG_INTERVAL:-3600}\"; done"]
    environment:
      ITV_LS_URL: http://limesurvey:8080/index.php/admin/remotecontrol
      ITV_LS_ALLOW_HTTP: "1"
      ITV_LS_SURVEY_ID: ${ITV_LS_SURVEY_ID:-0}
      ITV_LS_USER: ${ITV_LS_USER}
      ITV_LS_PASSWORD: ${ITV_LS_PASSWORD}
      ITV_MIN_COHORT: ${ITV_MIN_COHORT:-20}
      ITV_ROUNDING: ${ITV_ROUNDING:-5}
      ITV_AGG_INTERVAL: ${ITV_AGG_INTERVAL:-3600}
    volumes:
      - stats:/srv/stats
    networks: [agg_net]

  stats:
    <<: *restart
    image: nginx:1.30.6-alpine
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${STATS_PORT}:8080"
    volumes:
      - stats:/srv/stats:ro
      - ./infra/nginx/stats.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [stats_net]

networks:
  wp_net:
  ls_net:
    internal: true
  agg_net:
  stats_net:
  survey_net:

volumes:
  wp_db:
  wp_html:
  ls_db:
  ls_upload:
  stats:
